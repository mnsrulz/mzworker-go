name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  GO_VERSION: "1.21"

jobs:
  build:
    name: Build ${{ matrix.platform.os-name }}
    runs-on: ${{ matrix.platform.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: Linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: mzworker-linux-amd64

          - os-name: Linux-aarch64
            runs-on: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: mzworker-linux-arm64

          - os-name: macOS-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
            binary: mzworker-macos-amd64

          - os-name: macOS-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            binary: mzworker-macos-arm64

          - os-name: Windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mzworker-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf code
        run: make gen

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o ${{ matrix.platform.binary }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.binary }}
          path: ${{ matrix.platform.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mzworker-linux-amd64/mzworker-linux-amd64
            artifacts/mzworker-linux-arm64/mzworker-linux-arm64
            artifacts/mzworker-macos-amd64/mzworker-macos-amd64
            artifacts/mzworker-macos-arm64/mzworker-macos-arm64
            artifacts/mzworker-windows-amd64.exe/mzworker-windows-amd64.exe
