name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  GO_VERSION: "1.27.1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: mzworker-linux-amd64

          - name: linux-arm64
            runs-on: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: mzworker-linux-arm64
            cc: aarch64-linux-gnu-gcc

          # - name: macos-amd64
          #   runs-on: macos-13
          #   goos: darwin
          #   goarch: amd64
          #   binary: mzworker-macos-amd64

          - name: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            binary: mzworker-macos-arm64

          - name: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            binary: mzworker-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cross-compiler (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mzworker-linux-amd64/mzworker-linux-amd64
            artifacts/mzworker-linux-arm64/mzworker-linux-arm64
            artifacts/mzworker-macos-amd64/mzworker-macos-amd64
            artifacts/mzworker-macos-arm64/mzworker-macos-arm64
            artifacts/mzworker-windows-amd64.exe/mzworker-windows-amd64.exe
