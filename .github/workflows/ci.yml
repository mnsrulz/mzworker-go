name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.27.1"

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG=$(git describe --tags --abbrev=0)
          HASH=$(git rev-parse --short HEAD)

          if [[ "$(git rev-parse "$TAG")" == "$(git rev-parse HEAD)" ]]; then
            VERSION="$TAG"
            PRERELEASE=false
          else
            VERSION="${TAG}-${HASH}"
            PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Show version
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Prerelease: ${{ steps.version.outputs.prerelease }}"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: mzworker-linux-amd64

          - name: linux-arm64
            runs-on: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: mzworker-linux-arm64
            cc: aarch64-linux-gnu-gcc

          - name: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            binary: mzworker-macos-arm64

          - name: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            binary: mzworker-windows-amd64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cross-compiler (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -ldflags "-X main.version=${{ needs.version.outputs.version }}" -o ${{ matrix.binary }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: |
            artifacts/mzworker-linux-amd64/mzworker-linux-amd64
            artifacts/mzworker-linux-arm64/mzworker-linux-arm64
            artifacts/mzworker-macos-arm64/mzworker-macos-arm64
            artifacts/mzworker-windows-amd64.exe/mzworker-windows-amd64.exe

  docker-publish:
    name: Publish Docker images
    needs: [version, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v7
        with:
          name: mzworker-linux-amd64
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Go-only)
        id: meta-go
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push Go-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-go.outputs.tags }}
          labels: ${{ steps.meta-go.outputs.labels }}
          platforms: linux/amd64

      - name: Docker metadata (rclone)
        id: meta-rclone
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-rclone
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build and push rclone image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.rclone
          push: true
          tags: ${{ steps.meta-rclone.outputs.tags }}
          labels: ${{ steps.meta-rclone.outputs.labels }}
          platforms: linux/amd64
